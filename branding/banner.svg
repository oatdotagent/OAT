<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F5F0E6" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#F5F0E6" stop-opacity="0.92"/>
      <stop offset="0.75" stop-color="#F5F0E6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="#F5F0E6"/>
  <!-- Aurora glow on the right, fading into cream behind the text -->
  <g filter="url(#blur)">
    <ellipse cx="1060" cy="190" rx="300" ry="150" fill="rgb(40,150,140)" opacity="0.5"/>
    <ellipse cx="1330" cy="130" rx="230" ry="130" fill="rgb(60,115,190)" opacity="0.42"/>
    <ellipse cx="1220" cy="360" rx="320" ry="140" fill="rgb(30,130,95)" opacity="0.45"/>
    <path d="M820 420 C 1000 250, 1200 300, 1500 80" stroke="rgb(40,150,140)" stroke-width="90" fill="none" opacity="0.28"/>
  </g>
  <rect width="1500" height="500" fill="url(#fade)"/>
  <!-- Large faint mark on the right -->
  <g transform="translate(1210 250) scale(9) translate(-16 -16)" fill="none" stroke="#28251F" opacity="0.85" stroke-width="2" stroke-linecap="round">
    <circle cx="10" cy="10" r="2.6"/><circle cx="22" cy="10" r="2.6"/><circle cx="16" cy="22" r="2.6"/>
    <path d="M12.6 10h6.8M11.3 12.3l3.4 7.2M20.7 12.3l-3.4 7.2"/>
  </g>
  <!-- Text block (kept above the bottom-left area that the avatar covers) -->
  <g font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" fill="#28251F">
    <text x="120" y="150" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="3.5" fill="#2f5d50">AGENT INFRASTRUCTURE</text>
    <text x="116" y="238" font-size="84" font-weight="700" letter-spacing="1">OAT</text>
    <text x="120" y="296" font-size="34">Coordinate AI providers.</text>
    <text x="120" y="342" font-size="34" font-style="italic" fill="#2f5d50">Verify what comes back.</text>
  </g>
</svg>
