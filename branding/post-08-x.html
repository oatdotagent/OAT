<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OAT post 08 (X) — waitlist open</title>
<style>
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
  * { box-sizing: border-box; }
  .post { width: 1600px; height: 900px; padding: 76px 96px 56px; display: grid; grid-template-columns: 1fr 620px; grid-template-rows: 1fr auto; column-gap: 76px; background: #F5F0E6; color: #28251F; font-family: 'Segoe UI', system-ui, Arial, sans-serif; }
  .copy { align-self: center; }
  .badge { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; background: #2f5d50; color: #FFFCF6; font-size: 21px; font-weight: 700; }
  .badge i { width: 11px; height: 11px; border-radius: 50%; background: #FFFCF6; }
  h1 { margin: 30px 0 0; font: 700 104px/1 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }
  h1 em { display: block; font-weight: 400; color: #2f5d50; }
  .lede { margin: 32px 0 0; max-width: 700px; font-size: 30px; line-height: 1.45; color: rgb(40 37 31 / .72); text-wrap: pretty; }
  .card { align-self: center; padding: 44px 44px 40px; border-radius: 28px; background: #FFFCF6; border: 1px solid rgb(40 37 31 / .1); box-shadow: 0 30px 80px rgb(40 37 31 / .1); }
  .mark { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 20px; background: #28251F; }
  .mark svg { width: 46px; height: 46px; }
  .mark svg * { fill: none; stroke: #F5F0E6; stroke-width: 2; stroke-linecap: round; }
  h2 { margin: 26px 0 0; font: 700 44px/1.1 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }
  .card p { margin: 12px 0 0; font-size: 23px; line-height: 1.4; color: rgb(40 37 31 / .65); }
  .label { margin-top: 30px; font-size: 20px; font-weight: 600; }
  .label b { color: #c2412f; }
  .field { margin-top: 10px; padding: 19px 22px; border-radius: 14px; background: #F5F0E6; border: 1.5px solid rgb(40 37 31 / .16); font-size: 23px; color: rgb(40 37 31 / .45); }
  .btn { margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 21px; border-radius: 999px; background: #2f5d50; color: #FFFCF6; font-size: 25px; font-weight: 700; }
  .footer { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; margin-top: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 40px; height: 40px; }
  .brand svg * { fill: none; stroke: #28251F; stroke-width: 2; stroke-linecap: round; }
  .brand b { font: 700 30px/1 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; letter-spacing: .04em; }
  .handle { font-size: 19px; font-weight: 700; letter-spacing: .24em; color: rgb(40 37 31 / .75); }
</style>
</head>
<body>
<div class="post content">
  <div class="copy">
    <div class="badge"><i></i>Now open</div>
    <h1>The waitlist <em>is open.</em></h1>
    <p class="lede">Run AI workflows across providers and verify what comes back. Be among the first to get access.</p>
  </div>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 32 32"><circle cx="10" cy="10" r="2.6"/><circle cx="22" cy="10" r="2.6"/><circle cx="16" cy="22" r="2.6"/><path d="M12.6 10h6.8M11.3 12.3l3.4 7.2M20.7 12.3l-3.4 7.2"/></svg></div>
    <h2>Join the OAT waitlist</h2>
    <p>We'll email you when access opens.</p>
    <div class="label">Email <b>*</b></div>
    <div class="field">you@company.com</div>
    <div class="btn">Join the waitlist →</div>
  </div>
  <div class="footer">
    <div class="brand"><svg viewBox="0 0 32 32"><circle cx="10" cy="10" r="2.6"/><circle cx="22" cy="10" r="2.6"/><circle cx="16" cy="22" r="2.6"/><path d="M12.6 10h6.8M11.3 12.3l3.4 7.2M20.7 12.3l-3.4 7.2"/></svg><b>OAT</b></div>
    <div class="handle">GETOAT.SH</div>
  </div>
</div>
</body>
</html>
